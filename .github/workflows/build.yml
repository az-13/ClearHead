name: Build ClearHead IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Xcode Project
        run: |
          mkdir -p ClearHead.xcodeproj
          cat > ClearHead.xcodeproj/project.pbxproj << 'EOF'
