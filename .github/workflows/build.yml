EOF
          echo "✅ Xcode project created"

      - name: Build .app
        run: |
          xcodebuild -project ClearHead.xcodeproj \
            -scheme ClearHead \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./Build \
            clean build

      - name: Build IPA
        run: |
          mkdir -p Payload
          cp -R ./Build/Build/Products/Release-iphoneos/ClearHead.app Payload/
          zip -r ClearHead.ipa Payload/
          echo "✅ IPA built! Size:"
          ls -lh ClearHead.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClearHead.ipa
          path: ClearHead.ipa
          retention-days: 30
