name: Build ClearHead IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app for iPhone
        run: |
          xcodebuild -project ClearHead.xcodeproj \
            -scheme ClearHead \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ClearHead.app Payload/
          zip -r ClearHead.ipa Payload
          ls -lh ClearHead.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClearHead-ipa
          path: ClearHead.ipa
          retention-days: 30
