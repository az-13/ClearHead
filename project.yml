name: ClearHead
options:
  bundleIdPrefix: com.az13
  deploymentTarget:
    iOS: "16.0"

targets:
  ClearHead:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Views
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ClearHead
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.az13.clearhead
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
