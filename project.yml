name: ClearHead
options:
  bundleIdPrefix: com.az13
  deploymentTarget:
    iOS: "16.2"
  generateEmptyDirectories: true

targets:
  ClearHead:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Views
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ClearHead
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.az13.clearhead
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  ClearHeadWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ClearHeadWidget
    info:
      path: ClearHeadWidget/Info.plist
      properties:
        CFBundleDisplayName: ClearHeadWidget
        NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.az13.clearhead.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
